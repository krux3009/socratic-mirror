<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习页 · 苏格拉底之镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ef; --card:#fffdf9; --ink:#2b2b29; --muted:#6f6a62; --faint:#9b948a;
    --line:#e7e1d8; --line2:#efe9e0;
    --accent:#b06a4a; --accent-ink:#8a4f34; --accent-soft:#f3e3d9;
    --good:#5b8c5a; --shaky:#c79a3e; --cant:#bf5b4a;
    --shadow:0 10px 34px rgba(60,45,30,.10); --radius:16px;
    --maxw:760px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a18; --card:#232220; --ink:#ece7df; --muted:#a59e93; --faint:#7c756a;
      --line:#332f2a; --line2:#2b2824; --accent:#d98b66; --accent-ink:#e6a584; --accent-soft:#3a2c23;
      --shadow:0 10px 34px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.75; font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:32px 20px 96px}
  .top{margin-bottom:18px}
  .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:700}
  h1.concept{font-size:30px; line-height:1.25; margin:6px 0 2px; font-weight:700}
  .sub{color:var(--muted); font-size:14px}
  /* a11y: visible focus ring for keyboard users only */
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:3px; border-radius:7px}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
  /* stepper */
  .stepper{display:flex; gap:6px; margin:22px 0 8px; flex-wrap:wrap}
  .step{flex:1 1 0; min-width:74px; text-align:center; cursor:pointer; user-select:none; background:none; border:0; padding:0; font:inherit}
  .step .bar{height:5px; border-radius:999px; background:var(--line); transition:background .25s}
  .step.done .bar{background:var(--accent-soft)}
  .step.active .bar{background:var(--accent)}
  .step .lbl{font-size:11.5px; color:var(--faint); margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .step.active .lbl{color:var(--accent-ink); font-weight:700}
  .step.done .lbl{color:var(--muted)}
  /* card */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 30px 26px; margin-top:14px}
  .stage{display:none; animation:fade .35s ease}
  .stage.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .stage h2{font-size:21px; margin:0 0 4px}
  .stage h2:focus{outline:none}
  .stage .lead{color:var(--muted); font-size:14.5px; margin:0 0 18px}
  .prose p{margin:0 0 16px}
  .prose p:last-child{margin-bottom:0}
  /* two parables */
  .parable{margin:0 0 4px}
  .story-label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); font-weight:700; margin:22px 0 8px}
  .parable:first-of-type .story-label{margin-top:4px}
  .story-sep{text-align:center; color:var(--faint); letter-spacing:.5em; margin:24px 0 4px; user-select:none}
  .term{display:inline-block; font-size:26px; font-weight:700; color:var(--accent-ink); border-bottom:3px solid var(--accent-soft); padding-bottom:2px; margin:2px 0 14px}
  textarea{
    width:100%; min-height:130px; resize:vertical; padding:14px 15px; font:inherit; line-height:1.7;
    color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; outline:none; transition:border-color .2s;
  }
  textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
  .meter{font-size:12.5px; color:var(--faint); margin-top:6px}
  .hint{font-size:13px; color:var(--accent-ink); margin-top:8px; min-height:1.2em}
  button{font:inherit; cursor:pointer; border-radius:10px; border:1.5px solid transparent; padding:10px 16px; font-weight:600; transition:.15s}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent; color:var(--accent-ink); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--accent)}
  button:disabled{opacity:.45; cursor:not-allowed; filter:none}
  .nav{display:flex; justify-content:space-between; margin-top:24px; padding-top:18px; border-top:1px solid var(--line2)}
  .kbd-hint{font-size:12px; color:var(--faint); text-align:center; margin-top:10px}
  .kbd-hint kbd{font:inherit; font-size:11px; background:var(--line2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--muted)}
  /* locked model answer */
  .model{margin-top:16px; border:1px dashed var(--line); border-radius:12px; padding:16px; background:var(--line2)}
  .model .lock{color:var(--faint); font-size:13.5px; display:flex; align-items:center; gap:8px}
  .model .body{display:none; margin-top:0}
  .model.open{border-style:solid; background:var(--accent-soft)}
  .model.open .lock{display:none}
  .model.open .body{display:block}
  .model .tag{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); font-weight:700; margin-bottom:6px}
  /* gap list */
  .gap{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .gap .q{font-weight:500; margin-bottom:10px}
  .marks{display:flex; gap:8px; flex-wrap:wrap}
  .mark{font-size:13.5px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer}
  .mark[aria-pressed=true][data-v=solid]{border-color:var(--good); color:var(--good); background:rgba(91,140,90,.10)}
  .mark[aria-pressed=true][data-v=shaky]{border-color:var(--shaky); color:var(--shaky); background:rgba(199,154,62,.12)}
  .mark[aria-pressed=true][data-v=cant]{border-color:var(--cant); color:var(--cant); background:rgba(191,91,74,.10)}
  .redo{display:none; margin-top:11px}
  .redo.show{display:block}
  .redo textarea{min-height:70px}
  .redo .cap{font-size:13px; color:var(--cant); margin-bottom:6px; font-weight:600}
  /* comprehension MCQ */
  .mcq-q{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .mcq-q .q{font-weight:500; margin-bottom:10px}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{display:block; width:100%; text-align:left; font-weight:500; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{border-color:var(--good); color:var(--good); background:rgba(91,140,90,.10)}
  .opt.wrong{border-color:var(--cant); color:var(--cant); background:rgba(191,91,74,.10)}
  .opt:disabled{cursor:default; opacity:1}   /* override the global button:disabled fade so locked options stay legible (print + a11y) */
  .mcq-fb{font-size:13.5px; margin-top:10px; min-height:1.2em}
  .mcq-fb.good{color:var(--good)} .mcq-fb.bad{color:var(--cant)}
  /* flashcards */
  .fc{border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; cursor:pointer; background:var(--bg)}
  .fc .side{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700}
  .fc .q{font-weight:600; margin-top:4px}
  .fc .a{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); color:var(--ink); display:none}
  .fc.flip .a{display:block}
  .fc .fcbtns{display:none; gap:8px; margin-top:12px}
  .fc.flip .fcbtns{display:flex}
  .fc .fcbtn{font-size:13px; padding:5px 12px}
  .fc.got{border-color:var(--good)}
  .fc.again{border-color:var(--cant)}
  .fcbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; font-size:13.5px; color:var(--muted)}
  .challenge{margin-top:8px; border-top:1px solid var(--line2); padding-top:20px}
  .scenario{background:var(--accent-soft); border-radius:12px; padding:14px 16px; margin:10px 0 14px; font-weight:500}
  .done-banner{display:none; text-align:center; padding:20px; color:var(--good); font-weight:700; font-size:18px}
  .done .done-banner{display:block}
  /* toast + notice */
  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.28s}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .notice{max-width:560px; margin:14vh auto; text-align:center; color:var(--muted); padding:24px}
  .notice code{background:var(--line2); padding:2px 7px; border-radius:6px; color:var(--accent-ink)}
  .progress-note{font-size:12.5px; color:var(--faint); text-align:center; margin-top:14px}
  /* ===== print: a finished, self-archivable worked sheet =====
     Cmd/Ctrl-P expands every stage — your MCQ answers + the correct option +
     each rationale + every card back — and hides the interactive chrome. */
  @media print{
    :root{--bg:#fff; --card:#fff; --ink:#000; --muted:#222; --faint:#555; --line:#bbb; --line2:#ddd; --accent-soft:#f2f2f2; --shadow:none}
    body{font-size:11.5pt}
    .wrap{padding:0; max-width:none}
    .stepper, .nav, .row, .kbd-hint, #toast, .progress-note, .fc .fcbtns, .fcbar, .redo .cap{display:none !important}
    .card{box-shadow:none; border:0; padding:0}
    .stage{display:block !important; animation:none; page-break-inside:avoid; border-top:1px solid #ccc; padding-top:16px; margin-top:18px}
    .stage:first-of-type{border-top:0; margin-top:0; padding-top:0}
    .model{background:#fff !important; border:1px solid #ccc !important; border-style:solid !important}
    .model .lock{display:none !important}
    .model .body{display:block !important}
    .redo{display:block !important}
    .mcq-fb{display:block !important}
    .opt.correct::after{content:" ✓"}
    .fc .a{display:block !important}
    .fc{cursor:auto; break-inside:avoid}
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   DATA — the generator replaces the token below with a JSON object.
   See references/html-data-contract.md
   ============================================================ */
const TUTOR = /*__TUTOR_DATA__*/ null;

/* ---- UI strings (bilingual) ---- */
const STRINGS = {
  zh:{
    kicker:"双寓言 + 选择题诊断",
    steps:["故事","猜共性","揭晓","自测","查漏洞","辨比方","回忆"],
    storyLabel:(i,d)=>"故事"+["一","二","三","四","五"][i]+(d?" · "+d:""),
    s0t:"先读两个故事",      s0l:"两个故事表面毫不相干，却藏着同一台『机器』。读完它们——结尾才点破是什么概念，别急着往下翻。",
    s0sep:"∗ ∗ ∗",
    s0btn:"两个都读完了 →",
    sPt:"它们到底共享什么？",  sPl:"两个故事的皮完全不同，骨架却是同一台机器。先别翻到揭晓——从下面选出它们真正共用的那个机制。（这一步逼你剥掉表面、只认结构。）",
    s1t:"原来讲的是……",      s1l:"你认出的那台机器，正式名字是——",
    mcqT:"先自测一下你听懂了没", mcqL:"每题选一个；点下去立刻告诉你对不对、为什么。错了也没关系——看一眼解释就懂了。",
    s3t:"查一查你最容易翻车的地方", s3l:"这些是这个概念最常被搞反、被术语糊弄过去的点。逐题选，错了立刻看为什么。",
    s4t:"哪个比方抓住了本质？", s4l:"好比方 = 真理解的压缩；坏比方表面像、骨子里错。选出对的，并从反馈里看清错的错在哪、对的在哪会失效。",
    s5t:"主动回忆 + 迁移",     s5l:"先翻卡自测，再做一道迁移题。",
    transT:"迁移挑战",        transL:"把概念用到一个全新场景——选出正确的应用，而不是复述定义。",
    mcqCorrect:"✓ 对了", mcqWrong:"✗ 不对",
    mcqWrongGeneric:"不对——看正确选项就明白了。",
    mcqProgress:(a,b)=>`已答 ${a}/${b}`,
    next:"下一步 →",back:"← 上一步",
    front:"问题（点开看答案）",back2:"答案",fcgot:"记住了",fcagain:"再练",
    fconly:"只练没记住的",fcall:"练全部",fcleft:n=>`还剩 ${n} 张要练`,
    done:"完成学习",
    donemsg:"🎉 学完一轮。隔几天回来再翻一次卡，记得更牢。",
    note:"进度自动保存在本机浏览器，关掉再开还在。",
    kbdhint:`提示：用 <kbd>←</kbd> <kbd>→</kbd> 在各阶段之间走；想存档就 <kbd>⌘/Ctrl</kbd>+<kbd>P</kbd> 打印成 PDF（展开全部阶段）。`,
  },
  en:{
    kicker:"Two parables + multiple-choice",
    steps:["Stories","Predict","Reveal","Check","Gaps","Analogy","Recall"],
    storyLabel:(i,d)=>"Story "+(i+1)+(d?" · "+d:""),
    s0t:"First, two stories",  s0l:"Two stories that look unrelated hide the same machine. Read both — the concept is only named at the very end. Don't skip ahead.",
    s0sep:"∗ ∗ ∗",
    s0btn:"Read them both →",
    sPt:"What do they secretly share?", sPl:"The two stories share no surface detail, but the same skeleton. Before you reveal it — pick the one mechanism they truly have in common. (This forces you to strip the surface and grab the structure.)",
    s1t:"It was about…",       s1l:"The machine you spotted has a name —",
    mcqT:"Quick comprehension check", mcqL:"Pick one per question; you get instant right/wrong + why. Getting one wrong is fine — the explanation teaches it.",
    s3t:"Check where you'd trip", s3l:"These are the spots people most often get backwards or hide behind jargon. Pick one per question; a wrong pick shows you why on the spot.",
    s4t:"Which analogy nails it?", s4l:"A good analogy = compression of real understanding; a bad one looks similar but is wrong underneath. Pick the right one — the feedback shows where the wrong ones fail and where the right one breaks.",
    s5t:"Active recall + transfer", s5l:"Self-test with cards, then a transfer question.",
    transT:"Transfer challenge", transL:"Apply the concept to a brand-new scenario — pick the correct application, not a restatement of the definition.",
    mcqCorrect:"✓ Correct", mcqWrong:"✗ Not quite",
    mcqWrongGeneric:"Not quite — see the highlighted answer.",
    mcqProgress:(a,b)=>`${a}/${b} answered`,
    next:"Next →",back:"← Back",
    front:"Question (tap to flip)",back2:"Answer",fcgot:"Knew it",fcagain:"Again",
    fconly:"Only the ones I missed",fcall:"Practice all",fcleft:n=>`${n} card(s) left`,
    done:"Finish",
    donemsg:"🎉 One pass done. Come back in a few days and flip the cards again to lock it in.",
    note:"Progress auto-saves in this browser; reopen anytime.",
    kbdhint:`Tip: use <kbd>←</kbd> <kbd>→</kbd> to move between stages; <kbd>⌘/Ctrl</kbd>+<kbd>P</kbd> to print a PDF (all stages expand).`,
  }
};

/* ---- guard: raw template (not yet generated) ---- */
if(!TUTOR){
  document.getElementById('app').innerHTML =
    '<div class="notice"><h2>这是模板文件</h2><p>这是 <code>socratic-mirror</code> 的 HTML 模板。'+
    '运行该 skill（如 <code>/learn 比较优势</code>）来生成一份真正可用的学习页。</p>'+
    '<p style="font-size:13px">This is the template. Run the skill to generate a real study page.</p></div>';
  throw new Error("template only — no TUTOR data");
}

const L = STRINGS[TUTOR.lang === 'en' ? 'en' : 'zh'];
document.documentElement.lang = (TUTOR.lang==='en'?'en':'zh');
document.title = TUTOR.concept + " · 学习页";
const KEY = 'sm:' + TUTOR.slug;
const STAGES = 7;

/* ---- normalize parables (accept new [{story,domain}] or legacy single string) ---- */
const PARABLES = Array.isArray(TUTOR.encode.parables) && TUTOR.encode.parables.length
  ? TUTOR.encode.parables
  : (TUTOR.encode.parable ? [{story:TUTOR.encode.parable, domain:TUTOR.domain}] : []);

/* ---- state + persistence ---- */
const DEFAULT = {v:4, currentStage:0, mcqAnswers:{}, cardMarks:{}, done:false};
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===4) return Object.assign({}, DEFAULT, s); }catch(e){}
  return Object.assign({}, DEFAULT);  // older stores reset — every interactive stage is now multiple-choice (no free-text state)
}

// 💡 tweakable #3 — debounce: wait until typing pauses (400ms) before writing localStorage,
//   so we don't hit storage on every keystroke. Same pattern you'll reuse for debounced inputs in React.
let _t;
function save(){ clearTimeout(_t); _t = setTimeout(persist, 400); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// flashcard practice order: cards marked "again" come first, untouched next, "got it" last.
function cardOrder(){
  const idx = TUTOR.feynman.flashcards.map((_,i)=>i);
  const w = i => state.cardMarks[i]==='got' ? 2 : state.cardMarks[i]==='again' ? 0 : 1;
  return idx.sort((a,b)=> w(a)-w(b));
}

/* ---- small helpers ---- */
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function paras(s){return (s||"").split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");}
let toastT;
function toast(msg){const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),2400);}

/* ---- the five MCQ sets, in stage order. Every interactive stage is multiple-choice. ----
   Each question shares one shape: {id, stem, options, correct, whyCorrect, whyWrong}.
   ids are globally unique (prefix p/c/g/a/t), so one flat state.mcqAnswers map covers all stages. */
const MCQ_SETS = [
  {key:'predict',       data: (TUTOR.encode.predictChecks       || [])},
  {key:'comprehension', data: (TUTOR.feynman.comprehensionChecks || [])},
  {key:'gaps',          data: (TUTOR.feynman.gapChecks           || [])},
  {key:'analogy',       data: (TUTOR.feynman.analogyChecks       || [])},
  {key:'transfer',      data: (TUTOR.feynman.transferChecks      || [])},
];
const Q_BY_ID = {};
MCQ_SETS.forEach(s=> s.data.forEach(q=>{ Q_BY_ID[q.id] = q; }));

/* ============================================================
   BUILD THE PAGE
   ============================================================ */
const f = TUTOR.feynman;
const app = document.getElementById('app');
app.innerHTML = `
  <div class="wrap">
    <div class="top">
      <div class="kicker">${esc(L.kicker)}</div>
      <h1 class="concept">${esc(TUTOR.concept)}</h1>
      <div class="sub">${esc(TUTOR.domain||"")}${TUTOR.domain?" · ":""}${esc(TUTOR.difficulty||"")}</div>
    </div>
    <div class="stepper" id="stepper" role="tablist" aria-label="${esc(L.kicker)}">
      ${L.steps.map((s,i)=>`<button class="step" type="button" role="tab" id="tab-${i}" aria-controls="panel-${i}" aria-selected="false" data-i="${i}"><span class="bar" aria-hidden="true"></span><span class="lbl">${esc(s)}</span></button>`).join("")}
    </div>
    <div class="card">
      <!-- 0 parables -->
      <section class="stage" data-stage="0" role="tabpanel" id="panel-0" aria-labelledby="tab-0">
        <h2 tabindex="-1">${esc(L.s0t)}</h2><p class="lead">${esc(L.s0l)}</p>
        ${PARABLES.map((p,i)=>`<div class="parable"><div class="story-label">${esc(L.storyLabel(i, p.domain))}</div><div class="prose">${paras(p.story)}</div></div>`).join(`<div class="story-sep" aria-hidden="true">${esc(L.s0sep)}</div>`)}
        <div class="nav"><span></span><button class="btn-primary" data-next>${esc(L.s0btn)}</button></div>
      </section>
      <!-- 1 predict — MCQ: identify the shared mechanism (pre-reveal; options must NOT name the term) -->
      <section class="stage" data-stage="1" role="tabpanel" id="panel-1" aria-labelledby="tab-1">
        <h2 tabindex="-1">${esc(L.sPt)}</h2><p class="lead">${esc(L.sPl)}</p>
        ${mcqHTML('predict')}
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="predict">${esc(L.next)}</button></div>
      </section>
      <!-- 2 reveal (read-only) -->
      <section class="stage" data-stage="2" role="tabpanel" id="panel-2" aria-labelledby="tab-2">
        <h2 tabindex="-1">${esc(L.s1t)}</h2><p class="lead">${esc(L.s1l)}</p>
        <div class="term">${esc(TUTOR.encode.term)}</div>
        <div class="prose">${paras(TUTOR.encode.plainExplanation)}</div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next>${esc(L.next)}</button></div>
      </section>
      <!-- 3 comprehension MCQ -->
      <section class="stage" data-stage="3" role="tabpanel" id="panel-3" aria-labelledby="tab-3">
        <h2 tabindex="-1">${esc(L.mcqT)}</h2><p class="lead">${esc(L.mcqL)}</p>
        ${mcqHTML('comprehension')}
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="comprehension">${esc(L.next)}</button></div>
      </section>
      <!-- 4 gaps — MCQ probing the concept's common failure points -->
      <section class="stage" data-stage="4" role="tabpanel" id="panel-4" aria-labelledby="tab-4">
        <h2 tabindex="-1">${esc(L.s3t)}</h2><p class="lead">${esc(L.s3l)}</p>
        ${mcqHTML('gaps')}
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="gaps">${esc(L.next)}</button></div>
      </section>
      <!-- 5 analogy — MCQ: pick the analogy that holds -->
      <section class="stage" data-stage="5" role="tabpanel" id="panel-5" aria-labelledby="tab-5">
        <h2 tabindex="-1">${esc(L.s4t)}</h2><p class="lead">${esc(L.s4l)}</p>
        ${mcqHTML('analogy')}
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="analogy">${esc(L.next)}</button></div>
      </section>
      <!-- 6 recall — flashcards (kept) + transfer MCQ -->
      <section class="stage" data-stage="6" role="tabpanel" id="panel-6" aria-labelledby="tab-6">
        <h2 tabindex="-1">${esc(L.s5t)}</h2><p class="lead">${esc(L.s5l)}</p>
        <div class="fcbar"><button class="btn-ghost fcbtn" id="fcFilter">${esc(L.fconly)}</button><span id="fcLeft"></span></div>
        <div id="cards"></div>
        <div class="challenge">
          <h2 tabindex="-1">${esc(L.transT)}</h2><p class="lead">${esc(L.transL)}</p>
          ${mcqHTML('transfer')}
        </div>
        <div class="done-banner">${esc(L.donemsg)}</div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" id="doneBtn" data-gate="transfer">${esc(L.done)}</button></div>
      </section>
    </div>
    <div class="kbd-hint">${L.kbdhint}</div>
    <div class="progress-note">${esc(L.note)}</div>
  </div>`;

/* ---- render one MCQ set into its stage container + a progress meter ---- */
function mcqHTML(key){
  const set = MCQ_SETS.find(s=>s.key===key);
  const qs = set ? set.data : [];
  return `<div class="mcq" id="mcq-${key}" data-set="${key}">${qs.map(renderMCQ).join("")}</div>`
       + `<div class="meter" id="meter-${key}" aria-live="polite"></div>`;
}

/* ---- render one MCQ (one card per question; options are real radios) ---- */
function renderMCQ(q){
  return `<div class="mcq-q" data-mcq="${esc(q.id)}" data-correct="${q.correct}">
    <div class="q">${esc(q.stem)}</div>
    <div class="opts" role="radiogroup" aria-label="${esc(q.stem)}">
      ${(q.options||[]).map((o,oi)=>`<button type="button" class="opt" role="radio" aria-checked="false" data-oi="${oi}">${esc(o)}</button>`).join("")}
    </div>
    <div class="mcq-fb" aria-live="polite"></div>
  </div>`;
}

/* ---- flashcards render ---- */
function renderCards(){
  const box = document.getElementById('cards');
  const order = cardOrder();
  const onlyMissed = box.dataset.filter === '1';
  const visible = order.filter(i => !onlyMissed || state.cardMarks[i] !== 'got');
  box.innerHTML = visible.map(i=>{
    const c = TUTOR.feynman.flashcards[i]; const m = state.cardMarks[i]||"";
    return `<div class="fc ${m}" data-card="${i}" tabindex="0" role="button" aria-label="${esc(L.front)}">
      <div class="side">${esc(L.front)}</div><div class="q">${esc(c.q)}</div>
      <div class="a"><span class="side">${esc(L.back2)}</span><div>${esc(c.a)}</div></div>
      <div class="fcbtns"><button class="btn-ghost fcbtn" data-fc="got">${esc(L.fcgot)}</button><button class="btn-ghost fcbtn" data-fc="again">${esc(L.fcagain)}</button></div>
    </div>`;
  }).join("");
  const left = order.filter(i=>state.cardMarks[i] !== 'got').length;
  document.getElementById('fcLeft').textContent = L.fcleft(left);
}

/* ============================================================
   WIRE UP
   ============================================================ */
// stage navigation. `focusHeading` moves keyboard/SR focus into the new panel.
function showStage(i, focusHeading){
  i = Math.max(0, Math.min(STAGES-1, i));
  state.currentStage = i;
  document.querySelectorAll('.stage').forEach(s=> s.classList.toggle('active', +s.dataset.stage===i));
  document.querySelectorAll('.step').forEach(s=>{ const si=+s.dataset.i;
    s.classList.toggle('active', si===i); s.classList.toggle('done', si<i);
    s.setAttribute('aria-selected', si===i ? 'true':'false');
  });
  refreshGates();
  if(focusHeading){
    const h = document.querySelector('.stage[data-stage="'+i+'"] h2');
    if(h) h.focus({preventScroll:true});
  }
  window.scrollTo({top:0, behavior:'smooth'});
  save();
}
document.getElementById('stepper').addEventListener('click', e=>{ const st=e.target.closest('.step'); if(st) showStage(+st.dataset.i, true); });
document.querySelectorAll('[data-next]').forEach(b=> b.addEventListener('click', ()=> showStage(state.currentStage+1, true)));
document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', ()=> showStage(state.currentStage-1, true)));

// keyboard: ←/→ walk stages (respect the gate; never hijack while typing or with a modifier)
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==='textarea' || tag==='input') return;
  if(e.target.closest && e.target.closest('.opts')) return;  // arrows inside an MCQ option group must not jump stages
  if(e.key==='ArrowRight'){
    const nextBtn = document.querySelector('.stage[data-stage="'+state.currentStage+'"] [data-next]');
    if(nextBtn && !nextBtn.disabled){ e.preventDefault(); showStage(state.currentStage+1, true); }
  } else if(e.key==='ArrowLeft'){
    if(state.currentStage>0){ e.preventDefault(); showStage(state.currentStage-1, true); }
  }
});

// gate: every question in a stage's MCQ set must be ANSWERED (not necessarily correct) to advance.
//   The instant per-question "why" already teaches a wrong pick; gating on correctness would trap
//   a learner who just read the right rationale and invite blind option-cycling.
function gatePasses(setKey){
  const set = MCQ_SETS.find(s=>s.key===setKey);
  if(!set) return true;
  return set.data.every(q=> state.mcqAnswers[q.id]!==undefined);
}
function refreshGates(){
  document.querySelectorAll('[data-gate]').forEach(b=> b.disabled = !gatePasses(b.dataset.gate));
}

/* ---- MCQ engine: ONE delegated handler for every stage; instant feedback; locks on first answer ---- */
function paintMCQ(qEl){
  const id = qEl.dataset.mcq;
  const correct = +qEl.dataset.correct;
  const chosen = state.mcqAnswers[id];
  const answered = chosen !== undefined;
  const q = Q_BY_ID[id];
  const fb = qEl.querySelector('.mcq-fb');
  qEl.querySelectorAll('.opt').forEach(btn=>{
    const oi = +btn.dataset.oi;
    btn.disabled = answered;                                   // lock after first answer
    btn.classList.toggle('correct', answered && oi===correct);
    btn.classList.toggle('wrong',   answered && oi===chosen && chosen!==correct);
    btn.setAttribute('aria-checked', String(oi===chosen));
  });
  if(!answered){ fb.textContent=''; fb.className='mcq-fb'; return; }
  if(chosen===correct){ fb.textContent = L.mcqCorrect+(q&&q.whyCorrect ? ' — '+q.whyCorrect : ''); fb.className='mcq-fb good'; }
  else {
    const w = (q && q.whyWrong && q.whyWrong[chosen]) || L.mcqWrongGeneric;
    fb.textContent = L.mcqWrong+' — '+w; fb.className='mcq-fb bad';
  }
}
function updateMeters(){
  MCQ_SETS.forEach(set=>{
    const el = document.getElementById('meter-'+set.key); if(!el) return;
    const total = set.data.length;
    const ans = set.data.filter(q=> state.mcqAnswers[q.id]!==undefined).length;
    el.textContent = total ? L.mcqProgress(ans, total) : '';
  });
}
// one click handler covers every MCQ on the page (stages 1,3,4,5,6). Flashcard clicks aren't .opt → ignored.
document.querySelector('.card').addEventListener('click', e=>{
  const opt = e.target.closest('.opt'); if(!opt) return;
  const qEl = opt.closest('.mcq-q'); const id = qEl.dataset.mcq;
  if(state.mcqAnswers[id] !== undefined) return;   // first answer only — commit, then see the rationale
  state.mcqAnswers[id] = +opt.dataset.oi;
  paintMCQ(qEl); updateMeters(); refreshGates(); save();
});

// flashcards
const cardsBox = document.getElementById('cards');
cardsBox.dataset.filter = '0';
cardsBox.addEventListener('click', e=>{
  const fcBtn = e.target.closest('[data-fc]');
  if(fcBtn){ e.stopPropagation(); const card=fcBtn.closest('.fc'); const i=+card.dataset.card;
    state.cardMarks[i]=fcBtn.dataset.fc; save(); renderCards(); return; }
  const card = e.target.closest('.fc'); if(card) card.classList.toggle('flip');
});
// keyboard: Enter/Space flips a focused card
cardsBox.addEventListener('keydown', e=>{
  if(e.target.classList && e.target.classList.contains('fc') && (e.key==='Enter'||e.key===' ')){
    e.preventDefault(); e.target.classList.toggle('flip');
  }
});
document.getElementById('fcFilter').addEventListener('click', ()=>{
  const on = cardsBox.dataset.filter==='1'; cardsBox.dataset.filter = on?'0':'1';
  document.getElementById('fcFilter').textContent = on ? L.fconly : L.fcall;
  renderCards();
});
renderCards();

// done
document.getElementById('doneBtn').addEventListener('click', ()=>{
  state.done = true; document.querySelector('.stage[data-stage="6"]').classList.add('done'); save(); toast(L.donemsg);
});

/* ---- rehydrate MCQ answers + done + resume stage ---- */
if(state.done) document.querySelector('.stage[data-stage="6"]').classList.add('done');
document.querySelectorAll('.mcq-q').forEach(paintMCQ); updateMeters();
showStage(state.currentStage||0, false);
</script>
</body>
