<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习页 · 苏格拉底之镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ef; --card:#fffdf9; --ink:#2b2b29; --muted:#6f6a62; --faint:#9b948a;
    --line:#e7e1d8; --line2:#efe9e0;
    --accent:#b06a4a; --accent-ink:#8a4f34; --accent-soft:#f3e3d9;
    --good:#5b8c5a; --shaky:#c79a3e; --cant:#bf5b4a;
    --shadow:0 10px 34px rgba(60,45,30,.10); --radius:16px;
    --maxw:760px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a18; --card:#232220; --ink:#ece7df; --muted:#a59e93; --faint:#7c756a;
      --line:#332f2a; --line2:#2b2824; --accent:#d98b66; --accent-ink:#e6a584; --accent-soft:#3a2c23;
      --shadow:0 10px 34px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.75; font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:32px 20px 96px}
  .top{margin-bottom:18px}
  .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:700}
  h1.concept{font-size:30px; line-height:1.25; margin:6px 0 2px; font-weight:700}
  .sub{color:var(--muted); font-size:14px}
  /* stepper */
  .stepper{display:flex; gap:6px; margin:22px 0 8px; flex-wrap:wrap}
  .step{flex:1 1 0; min-width:84px; text-align:center; cursor:pointer; user-select:none}
  .step .bar{height:5px; border-radius:999px; background:var(--line); transition:background .25s}
  .step.done .bar{background:var(--accent-soft)}
  .step.active .bar{background:var(--accent)}
  .step .lbl{font-size:11.5px; color:var(--faint); margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .step.active .lbl{color:var(--accent-ink); font-weight:700}
  .step.done .lbl{color:var(--muted)}
  /* card */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 30px 26px; margin-top:14px}
  .stage{display:none; animation:fade .35s ease}
  .stage.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .stage h2{font-size:21px; margin:0 0 4px}
  .stage .lead{color:var(--muted); font-size:14.5px; margin:0 0 18px}
  .prose p{margin:0 0 16px}
  .prose p:last-child{margin-bottom:0}
  .term{display:inline-block; font-size:26px; font-weight:700; color:var(--accent-ink); border-bottom:3px solid var(--accent-soft); padding-bottom:2px; margin:2px 0 14px}
  textarea{
    width:100%; min-height:130px; resize:vertical; padding:14px 15px; font:inherit; line-height:1.7;
    color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; outline:none; transition:border-color .2s;
  }
  textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
  .meter{font-size:12.5px; color:var(--faint); margin-top:6px}
  .hint{font-size:13px; color:var(--accent-ink); margin-top:8px; min-height:1.2em}
  button{font:inherit; cursor:pointer; border-radius:10px; border:1.5px solid transparent; padding:10px 16px; font-weight:600; transition:.15s}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent; color:var(--accent-ink); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--accent)}
  button:disabled{opacity:.45; cursor:not-allowed; filter:none}
  .nav{display:flex; justify-content:space-between; margin-top:24px; padding-top:18px; border-top:1px solid var(--line2)}
  /* locked model answer */
  .model{margin-top:16px; border:1px dashed var(--line); border-radius:12px; padding:16px; background:var(--line2)}
  .model .lock{color:var(--faint); font-size:13.5px; display:flex; align-items:center; gap:8px}
  .model .body{display:none; margin-top:0}
  .model.open{border-style:solid; background:var(--accent-soft)}
  .model.open .lock{display:none}
  .model.open .body{display:block}
  .model .tag{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); font-weight:700; margin-bottom:6px}
  /* gap list */
  .gap{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .gap .q{font-weight:500; margin-bottom:10px}
  .marks{display:flex; gap:8px; flex-wrap:wrap}
  .mark{font-size:13.5px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer}
  .mark[data-v=solid].on{border-color:var(--good); color:var(--good); background:rgba(91,140,90,.10)}
  .mark[data-v=shaky].on{border-color:var(--shaky); color:var(--shaky); background:rgba(199,154,62,.12)}
  .mark[data-v=cant].on{border-color:var(--cant); color:var(--cant); background:rgba(191,91,74,.10)}
  .redo{display:none; margin-top:11px}
  .redo.show{display:block}
  .redo textarea{min-height:70px}
  .redo .cap{font-size:13px; color:var(--cant); margin-bottom:6px; font-weight:600}
  /* flashcards */
  .fc{border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; cursor:pointer; background:var(--bg)}
  .fc .side{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700}
  .fc .q{font-weight:600; margin-top:4px}
  .fc .a{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); color:var(--ink); display:none}
  .fc.flip .a{display:block}
  .fc .fcbtns{display:none; gap:8px; margin-top:12px}
  .fc.flip .fcbtns{display:flex}
  .fc .fcbtn{font-size:13px; padding:5px 12px}
  .fc.got{border-color:var(--good)}
  .fc.again{border-color:var(--cant)}
  .fcbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; font-size:13.5px; color:var(--muted)}
  .challenge{margin-top:8px; border-top:1px solid var(--line2); padding-top:20px}
  .scenario{background:var(--accent-soft); border-radius:12px; padding:14px 16px; margin:10px 0 14px; font-weight:500}
  .done-banner{display:none; text-align:center; padding:20px; color:var(--good); font-weight:700; font-size:18px}
  .done .done-banner{display:block}
  /* toast + notice */
  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.28s}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .notice{max-width:560px; margin:14vh auto; text-align:center; color:var(--muted); padding:24px}
  .notice code{background:var(--line2); padding:2px 7px; border-radius:6px; color:var(--accent-ink)}
  .progress-note{font-size:12.5px; color:var(--faint); text-align:center; margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   DATA — the generator replaces the token below with a JSON object.
   See references/html-data-contract.md
   ============================================================ */
const TUTOR = /*__TUTOR_DATA__*/ null;

/* ---- UI strings (bilingual) ---- */
const STRINGS = {
  zh:{
    kicker:"寓言 + 费曼学习法",
    steps:["寓言","揭晓","讲一遍","找漏洞","打比方","回忆"],
    s0t:"先听个故事",        s0l:"读完它。结尾才会点破这讲的是什么概念——别急着往下翻。",
    s0btn:"我读完了 →",
    s1t:"原来讲的是……",      s1l:"这就是刚才那个故事的内核。",
    s2t:"现在你来讲",         s2l:"用大白话讲给一个12岁小孩听，不许用术语。讲不顺的地方，就是你还没真懂的地方。",
    s2ph:"假设对面是个聪明但完全没学过这个的小孩，你会怎么讲……",
    s3t:"找出你的漏洞",       s3l:"逐条自评。标成『还不行/不太稳』的，必须回去重讲一遍——漏洞不许标完就跑。",
    s4t:"打个比方",          s4l:"一个好比方 = 真理解的压缩。写下你的比方；它在哪里成立、在哪里会失效？",
    s4ph:"这个概念就像……因为……",
    s5t:"主动回忆 + 教学挑战", s5l:"先翻卡自测，再用学到的去解一个新场景。",
    reveal:"🔓 看范例解答",   locked:"先写下你自己的解释，才解锁范例（认得 ≠ 懂得）",
    copy:"📋 复制评分提示词",  copied:"已复制——粘到任意 AI 对话里让它给你点评",
    copyfail:"复制失败，请手动选中复制",
    modelTag:"范例解答（写完再对照）",
    solid:"✓ 讲得清",sh:"~ 不太稳",cant:"✗ 还不行",
    redocap:"回去用更简单的话再讲一遍这一点：",
    redoph:"重讲……",
    next:"下一步 →",back:"← 上一步",
    front:"问题（点开看答案）",back2:"答案",fcgot:"记住了",fcagain:"再练",
    fconly:"只练没记住的",fcall:"练全部",fcleft:n=>`还剩 ${n} 张要练`,
    challenge:"教学挑战",done:"完成学习",
    donemsg:"🎉 学完一轮。隔几天回来再翻一次卡，记得更牢。",
    note:"进度自动保存在本机浏览器，关掉再开还在。",
    aHintLink:"试着明确写出『谁对应谁』。",aHintShort:"再展开一点——一句话还不够。",
    wc:n=>`${n} 字`,
  },
  en:{
    kicker:"Parable + Feynman",
    steps:["Parable","Reveal","Explain","Gaps","Analogy","Recall"],
    s0t:"First, a story",     s0l:"Read it. The concept is only named at the very end — don't skip ahead.",
    s0btn:"I've read it →",
    s1t:"It was about…",      s1l:"That story was this idea in disguise.",
    s2t:"Now you explain it", s2l:"Explain it to a smart 12-year-old, no jargon. Wherever you stall is where you don't really get it yet.",
    s2ph:"Imagine a clever kid who's never seen this. How would you put it…",
    s3t:"Hunt your gaps",     s3l:"Self-mark each one. Anything 'not yet / shaky' you must re-explain — no marking-and-running.",
    s4t:"Forge an analogy",   s4l:"A good analogy = compression of real understanding. Where does yours hold, and where does it break?",
    s4ph:"This is like… because…",
    s5t:"Active recall + teach-back", s5l:"Self-test with cards, then use it on a fresh scenario.",
    reveal:"🔓 Show model answer", locked:"Write your own attempt first to unlock (recognizing ≠ understanding)",
    copy:"📋 Copy grading prompt", copied:"Copied — paste into any AI chat for feedback",
    copyfail:"Copy failed — select and copy manually",
    modelTag:"Model answer (compare after you write)",
    solid:"✓ Got it",sh:"~ Shaky",cant:"✗ Not yet",
    redocap:"Go back and re-explain this in simpler words:",
    redoph:"Re-explain…",
    next:"Next →",back:"← Back",
    front:"Question (tap to flip)",back2:"Answer",fcgot:"Knew it",fcagain:"Again",
    fconly:"Only the ones I missed",fcall:"Practice all",fcleft:n=>`${n} card(s) left`,
    challenge:"Teach-back challenge",done:"Finish",
    donemsg:"🎉 One pass done. Come back in a few days and flip the cards again to lock it in.",
    note:"Progress auto-saves in this browser; reopen anytime.",
    aHintLink:"Try naming what maps to what.",aHintShort:"Expand a bit more — one line isn't enough.",
    wc:n=>`${n} words`,
  }
};

/* ---- guard: raw template (not yet generated) ---- */
if(!TUTOR){
  document.getElementById('app').innerHTML =
    '<div class="notice"><h2>这是模板文件</h2><p>这是 <code>socratic-mirror</code> 的 HTML 模板。'+
    '运行该 skill（如 <code>/learn 比较优势</code>）来生成一份真正可用的学习页。</p>'+
    '<p style="font-size:13px">This is the template. Run the skill to generate a real study page.</p></div>';
  throw new Error("template only — no TUTOR data");
}

const L = STRINGS[TUTOR.lang === 'en' ? 'en' : 'zh'];
document.documentElement.lang = (TUTOR.lang==='en'?'en':'zh');
document.title = TUTOR.concept + " · 学习页";
const KEY = 'sm:' + TUTOR.slug;
const STAGES = 6;

/* ---- state + persistence ---- */
const DEFAULT = {v:1, currentStage:0, explainText:"", gapMarks:{}, gapNotes:{},
                 analogyText:"", teachBackText:"", cardMarks:{}, revealed:{}, done:false};
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return Object.assign({}, DEFAULT, s); }catch(e){}
  return Object.assign({}, DEFAULT);
}

// 💡 tweakable #3 — debounce: wait until typing pauses (400ms) before writing localStorage,
//   so we don't hit storage on every keystroke. Same pattern you'll reuse for debounced inputs in React.
let _t;
function save(){ clearTimeout(_t); _t = setTimeout(persist, 400); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---- THE gate: produce before reveal ---- */
// 💡 tweakable #1 — the heart of this whole tool. A model answer stays locked until canReveal() is true.
//   Default: require a real attempt (≥12 latin words OR ≥25 CJK characters). Make it smarter if you like:
//   require ≥2 sentences, reject if it's just the term repeated, scale the bar per stage, etc.
function canReveal(text){
  const t = (text||"").trim();
  if(!t) return false;
  const words = t.split(/\s+/).filter(Boolean).length;
  const cjk = (t.match(/[一-鿿]/g)||[]).length;
  return words >= 12 || cjk >= 25;
}

// 💡 tweakable #2 — a gentle nudge on the learner's analogy (not a grade). Pure heuristics over the text.
function checkAnalogy(text){
  const t = (text||"").trim();
  if(!t) return "";
  const out = [];
  if(!/(像|如同|好比|类似|相当于|like |as if|similar|analog)/i.test(t)) out.push(L.aHintLink);
  if(!canReveal(t)) out.push(L.aHintShort);
  return out.join(" ");
}

// 💡 tweakable #4 — practice order: cards you marked "again" come first, untouched next, "got it" last.
function cardOrder(){
  const idx = TUTOR.feynman.flashcards.map((_,i)=>i);
  const w = i => state.cardMarks[i]==='got' ? 2 : state.cardMarks[i]==='again' ? 0 : 1;
  return idx.sort((a,b)=> w(a)-w(b));
}

/* ---- small helpers ---- */
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function paras(s){return (s||"").split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");}
function wordCount(t){t=(t||"").trim(); if(!t) return 0; const cjk=(t.match(/[一-鿿]/g)||[]).length; return cjk || t.split(/\s+/).filter(Boolean).length;}
let toastT;
function toast(msg){const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),2400);}

async function copyGrade(stageKey, attempt){
  const payload = TUTOR.gradingPrompts[stageKey] + "\n\n【概念 / Concept】" + TUTOR.concept + "\n\n【我的作答 / My attempt】\n" + (attempt||"");
  try{ await navigator.clipboard.writeText(payload); toast(L.copied); }
  catch(e){
    // fallback for file:// where the async Clipboard API may be blocked
    const ta=document.createElement('textarea'); ta.value=payload; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(L.copied); }catch(e2){ toast(L.copyfail); }
    document.body.removeChild(ta);
  }
}

/* ============================================================
   BUILD THE PAGE
   ============================================================ */
const f = TUTOR.feynman;
const app = document.getElementById('app');
app.innerHTML = `
  <div class="wrap">
    <div class="top">
      <div class="kicker">${esc(L.kicker)}</div>
      <h1 class="concept">${esc(TUTOR.concept)}</h1>
      <div class="sub">${esc(TUTOR.domain||"")}${TUTOR.domain?" · ":""}${esc(TUTOR.difficulty||"")}</div>
    </div>
    <div class="stepper" id="stepper">
      ${L.steps.map((s,i)=>`<div class="step" data-i="${i}"><div class="bar"></div><div class="lbl">${esc(s)}</div></div>`).join("")}
    </div>
    <div class="card">
      <!-- 0 parable -->
      <section class="stage" data-stage="0">
        <h2>${esc(L.s0t)}</h2><p class="lead">${esc(L.s0l)}</p>
        <div class="prose">${paras(TUTOR.encode.parable)}</div>
        <div class="nav"><span></span><button class="btn-primary" data-next>${esc(L.s0btn)}</button></div>
      </section>
      <!-- 1 reveal -->
      <section class="stage" data-stage="1">
        <h2>${esc(L.s1t)}</h2><p class="lead">${esc(L.s1l)}</p>
        <div class="term">${esc(f && TUTOR.encode.term)}</div>
        <div class="prose">${paras(TUTOR.encode.plainExplanation)}</div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next>${esc(L.next)}</button></div>
      </section>
      <!-- 2 explain -->
      <section class="stage" data-stage="2">
        <h2>${esc(L.s2t)}</h2><p class="lead">${esc(L.s2l)}</p>
        <textarea id="explain" placeholder="${esc(L.s2ph)}"></textarea>
        <div class="meter" id="explainMeter"></div>
        <div class="row">
          <button class="btn-ghost" data-copy="simpleExplanation" data-src="explain">${esc(L.copy)}</button>
          <button class="btn-ghost" data-reveal="simpleExplanation" data-src="explain">${esc(L.reveal)}</button>
        </div>
        <div class="model" id="model-simpleExplanation">
          <div class="lock">🔒 ${esc(L.locked)}</div>
          <div class="body"><div class="tag">${esc(L.modelTag)}</div><div class="prose">${paras(f.modelSimpleExplanation)}</div></div>
        </div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="explain">${esc(L.next)}</button></div>
      </section>
      <!-- 3 gaps -->
      <section class="stage" data-stage="3">
        <h2>${esc(L.s3t)}</h2><p class="lead">${esc(L.s3l)}</p>
        <div id="gaps">${f.gapChecklist.map(g=>gapHTML(g)).join("")}</div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="gaps">${esc(L.next)}</button></div>
      </section>
      <!-- 4 analogy -->
      <section class="stage" data-stage="4">
        <h2>${esc(L.s4t)}</h2><p class="lead">${esc(L.s4l)}</p>
        <textarea id="analogy" placeholder="${esc(L.s4ph)}"></textarea>
        <div class="hint" id="analogyHint"></div>
        <div class="row">
          <button class="btn-ghost" data-copy="analogy" data-src="analogy">${esc(L.copy)}</button>
          <button class="btn-ghost" data-reveal="analogy" data-src="analogy">${esc(L.reveal)}</button>
        </div>
        <div class="model" id="model-analogy">
          <div class="lock">🔒 ${esc(L.locked)}</div>
          <div class="body"><div class="tag">${esc(L.modelTag)}</div><div class="prose">${paras(f.modelAnalogy)}</div></div>
        </div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" data-next data-gate="analogy">${esc(L.next)}</button></div>
      </section>
      <!-- 5 recall -->
      <section class="stage" data-stage="5">
        <h2>${esc(L.s5t)}</h2><p class="lead">${esc(L.s5l)}</p>
        <div class="fcbar"><button class="btn-ghost fcbtn" id="fcFilter">${esc(L.fconly)}</button><span id="fcLeft"></span></div>
        <div id="cards"></div>
        <div class="challenge">
          <h2>${esc(L.challenge)}</h2>
          <div class="scenario">${esc(f.teachBackPrompt)}</div>
          <textarea id="teach" placeholder="${esc(L.s2ph)}"></textarea>
          <div class="row"><button class="btn-ghost" data-copy="teachBack" data-src="teach">${esc(L.copy)}</button></div>
        </div>
        <div class="done-banner">${esc(L.donemsg)}</div>
        <div class="nav"><button class="btn-ghost" data-back>${esc(L.back)}</button><button class="btn-primary" id="doneBtn">${esc(L.done)}</button></div>
      </section>
    </div>
    <div class="progress-note">${esc(L.note)}</div>
  </div>`;

function gapHTML(g){
  return `<div class="gap" data-gap="${esc(g.id)}">
    <div class="q">${esc(g.prompt)}</div>
    <div class="marks">
      <span class="mark" data-v="solid">${esc(L.solid)}</span>
      <span class="mark" data-v="shaky">${esc(L.sh)}</span>
      <span class="mark" data-v="cant">${esc(L.cant)}</span>
    </div>
    <div class="redo"><div class="cap">${esc(L.redocap)}</div><textarea placeholder="${esc(L.redoph)}"></textarea></div>
  </div>`;
}

/* ---- flashcards render ---- */
function renderCards(){
  const box = document.getElementById('cards');
  const order = cardOrder();
  const onlyMissed = box.dataset.filter === '1';
  const visible = order.filter(i => !onlyMissed || state.cardMarks[i] !== 'got');
  box.innerHTML = visible.map(i=>{
    const c = TUTOR.feynman.flashcards[i]; const m = state.cardMarks[i]||"";
    return `<div class="fc ${m}" data-card="${i}">
      <div class="side">${esc(L.front)}</div><div class="q">${esc(c.q)}</div>
      <div class="a"><span class="side">${esc(L.back2)}</span><div>${esc(c.a)}</div></div>
      <div class="fcbtns"><button class="btn-ghost fcbtn" data-fc="got">${esc(L.fcgot)}</button><button class="btn-ghost fcbtn" data-fc="again">${esc(L.fcagain)}</button></div>
    </div>`;
  }).join("");
  const left = order.filter(i=>state.cardMarks[i] !== 'got').length;
  document.getElementById('fcLeft').textContent = L.fcleft(left);
}

/* ============================================================
   WIRE UP
   ============================================================ */
// stage navigation
function showStage(i){
  i = Math.max(0, Math.min(STAGES-1, i));
  state.currentStage = i;
  document.querySelectorAll('.stage').forEach(s=> s.classList.toggle('active', +s.dataset.stage===i));
  document.querySelectorAll('.step').forEach(s=>{ const si=+s.dataset.i; s.classList.toggle('active', si===i); s.classList.toggle('done', si<i); });
  refreshGates();
  window.scrollTo({top:0, behavior:'smooth'});
  save();
}
document.getElementById('stepper').addEventListener('click', e=>{ const st=e.target.closest('.step'); if(st) showStage(+st.dataset.i); });
document.querySelectorAll('[data-next]').forEach(b=> b.addEventListener('click', ()=> showStage(state.currentStage+1)));
document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', ()=> showStage(state.currentStage-1)));

// gate: can the learner advance from this stage?
function gatePasses(name){
  if(name==='explain') return canReveal(state.explainText);
  if(name==='analogy') return canReveal(state.analogyText);
  if(name==='gaps') return f.gapChecklist.every(g=> state.gapMarks[g.id]);
  return true;
}
function refreshGates(){
  document.querySelectorAll('[data-gate]').forEach(b=> b.disabled = !gatePasses(b.dataset.gate));
  document.querySelectorAll('[data-reveal]').forEach(b=>{
    const src=document.getElementById(b.dataset.src); const key=b.dataset.reveal;
    if(state.revealed[key]) return; // already opened
    b.disabled = !canReveal(src ? src.value : "");
  });
}

// reveal buttons
document.querySelectorAll('[data-reveal]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const key=b.dataset.reveal; const src=document.getElementById(b.dataset.src);
    if(!canReveal(src?src.value:"")) return;
    document.getElementById('model-'+key).classList.add('open');
    b.disabled = true; state.revealed[key]=true; save();
  });
});

// copy grading buttons
document.querySelectorAll('[data-copy]').forEach(b=>{
  b.addEventListener('click', ()=>{ const src=document.getElementById(b.dataset.src); copyGrade(b.dataset.copy, src?src.value:""); });
});

// explain textarea
const explain = document.getElementById('explain');
explain.value = state.explainText;
explain.addEventListener('input', ()=>{
  state.explainText = explain.value;
  document.getElementById('explainMeter').textContent = L.wc(wordCount(explain.value));
  refreshGates(); save();
});

// analogy textarea
const analogy = document.getElementById('analogy');
analogy.value = state.analogyText;
analogy.addEventListener('input', ()=>{
  state.analogyText = analogy.value;
  document.getElementById('analogyHint').textContent = checkAnalogy(analogy.value);
  refreshGates(); save();
});

// teach-back textarea
const teach = document.getElementById('teach');
teach.value = state.teachBackText;
teach.addEventListener('input', ()=>{ state.teachBackText = teach.value; save(); });

// gap marks + redo boxes
document.querySelectorAll('.gap').forEach(gp=>{
  const id = gp.dataset.gap;
  const redo = gp.querySelector('.redo'); const redoTa = redo.querySelector('textarea');
  function paint(){
    const v = state.gapMarks[id];
    gp.querySelectorAll('.mark').forEach(m=> m.classList.toggle('on', m.dataset.v===v));
    redo.classList.toggle('show', v==='shaky' || v==='cant');
  }
  gp.querySelectorAll('.mark').forEach(m=>{
    m.addEventListener('click', ()=>{ state.gapMarks[id]=m.dataset.v; paint(); refreshGates(); save(); });
  });
  redoTa.value = state.gapNotes[id]||"";
  redoTa.addEventListener('input', ()=>{ state.gapNotes[id]=redoTa.value; save(); });
  paint();
});

// flashcards
const cardsBox = document.getElementById('cards');
cardsBox.dataset.filter = '0';
cardsBox.addEventListener('click', e=>{
  const fcBtn = e.target.closest('[data-fc]');
  if(fcBtn){ e.stopPropagation(); const card=fcBtn.closest('.fc'); const i=+card.dataset.card;
    state.cardMarks[i]=fcBtn.dataset.fc; save(); renderCards(); return; }
  const card = e.target.closest('.fc'); if(card) card.classList.toggle('flip');
});
document.getElementById('fcFilter').addEventListener('click', ()=>{
  const on = cardsBox.dataset.filter==='1'; cardsBox.dataset.filter = on?'0':'1';
  document.getElementById('fcFilter').textContent = on ? L.fconly : L.fcall;
  renderCards();
});
renderCards();

// done
document.getElementById('doneBtn').addEventListener('click', ()=>{
  state.done = true; document.querySelector('.stage[data-stage="5"]').classList.add('done'); save(); toast(L.donemsg);
});

/* ---- rehydrate reveals + done + resume stage ---- */
Object.keys(state.revealed).forEach(k=>{ if(state.revealed[k]){ const m=document.getElementById('model-'+k); if(m) m.classList.add('open'); } });
if(state.done) document.querySelector('.stage[data-stage="5"]').classList.add('done');
document.getElementById('explainMeter').textContent = L.wc(wordCount(state.explainText));
document.getElementById('analogyHint').textContent = checkAnalogy(state.analogyText);
showStage(state.currentStage||0);
</script>
</body>
</html>
